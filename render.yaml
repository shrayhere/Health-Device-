# ==============================================================================
# Render Blueprint Specification for HealthDevice Ecosystem
# ==============================================================================
# One-shot automated deployment of both Frontend (React/Vite SPA) and
# Backend (Node/Express API with Supabase & Groq AI).
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend REST API (Node/Express Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: healthdevice-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000

      # Allowed CORS origin from the frontend Render site (e.g. https://healthdevice-frontend.onrender.com)
      - key: FRONTEND_URL
        sync: false

      # Supabase Project Credentials
      - key: SUPABASE_URL
        sync: false

      # Supabase Service Role Secret Key (Must only exist on the backend)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # Supabase PostgreSQL Pooled Connection String (Port 6543)
      - key: DATABASE_URL
        sync: false

      # Groq Cloud API Key for AI Health Assistant (optional)
      - key: GROQ_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Frontend Web Portal (React + Vite Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: healthdevice-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # SPA fallback rewrite: ensures client-side routes (e.g. /ai, /alarms, /auth) resolve on page reload
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Base URL pointing to the deployed backend web service above
      - key: VITE_API_BASE_URL
        sync: false

      # Supabase Public API Credentials (Safe for client-side usage)
      - key: VITE_SUPABASE_URL
        sync: false

      - key: VITE_SUPABASE_ANON_KEY
        sync: false
