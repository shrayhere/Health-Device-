# ==============================================================================
# Render Blueprint Specification for HealthDevice Ecosystem
# ==============================================================================
# Fully automated zero-prompt deployment of both Frontend (React/Vite SPA) and
# Backend (Node/Express API with Supabase & Groq AI).
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend REST API (Node/Express Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: healthdevice-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000

      - key: FRONTEND_URL
        value: https://healthdevice-frontend.onrender.com

      - key: SUPABASE_URL
        value: https://ssupmhqrfspmezcvmgbv.supabase.co

      - key: SUPABASE_SERVICE_ROLE_KEY
        value: sb_publishable_xtCDXtgVEAlwtAgjnKnPcA_Ke0WhUyG

      - key: DATABASE_URL
        value: ""

      - key: GROQ_API_KEY
        value: ""

  # ----------------------------------------------------------------------------
  # 2. Frontend Web Portal (React + Vite Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: healthdevice-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://healthdevice-backend.onrender.com

      - key: VITE_SUPABASE_URL
        value: https://ssupmhqrfspmezcvmgbv.supabase.co

      - key: VITE_SUPABASE_ANON_KEY
        value: sb_publishable_xtCDXtgVEAlwtAgjnKnPcA_Ke0WhUyG
